      - Annotating: guide/annotating.md
      - Representations: guide/representations.md
      - Privacy: guide/privacy.md
      - Glossary: guide/glossary.md
  - Technical reference:
      - Definitions: tracker/concepts.md
      - "Parser: schema format": ddp_parser/index.md
      - "Parser: pipeline": ddp_parser/pipeline.md
