{# The modal's title and close button, fixed at the top; the caller passes ``title`` and wraps the rest in <div class="dialog__body"> (which scrolls). #}
<div class="dialog__header">
  <h2>{{ title }}</h2>
  <form method="dialog">
    <button type="submit" class="btn-close" aria-label="Close"></button>
  </form>
</div>
