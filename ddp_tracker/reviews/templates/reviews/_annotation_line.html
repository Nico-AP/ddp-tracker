{# One location's annotation in the review panel, with a way to change it. #}
{% if loc.annotation %}
  <button type="button"
          class="link-button"
          hx-get="{% url 'annotations:modal' loc.annotation.pk %}"
          hx-target="#modal"
          hx-swap="innerHTML">{{ loc.annotation }}</button>
{% elif loc.ignored %}
  <span class="muted">not a data point</span>
{% else %}
  <span class="muted">none yet</span>
{% endif %}
{% if user.is_authenticated %}
  ·
  <button type="button"
          class="link-button"
          hx-get="{% url 'schemas:triage' loc.pk %}{% if observation %}?upload={{ upload.pk }}{% endif %}"
          hx-target="#modal"
          hx-swap="innerHTML">Change</button>
{% endif %}
