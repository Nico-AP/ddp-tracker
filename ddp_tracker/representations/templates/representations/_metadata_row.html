{# One metadata row in a slot's section of the dialog (forms.MetadataRowForm): the data point describes the slot as the role. Also the <template> "+ Add metadata" clones (prefix __prefix__). #}
<tr data-row>
  <td>
    {{ row.location }}
    {% for error in row.non_field_errors %}<div class="form__error">{{ error }}</div>{% endfor %}
    {% for field in row %}
      {% for error in field.errors %}<div class="form__error">{{ error }}</div>{% endfor %}
    {% endfor %}
  </td>
  <td>{{ row.role }}</td>
  <td>
    <button type="button"
            class="link-button"
            data-remove-row
            aria-label="Remove this metadata row">✕</button>
  </td>
</tr>
