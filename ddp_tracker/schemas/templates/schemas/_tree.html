{% for row in rows %}
  <li class="tree__item tree__item--{{ row.profile.main_kind }}">
    {% if row.children %}
      <details
        hx-get="{% url 'schemas:children' platform.slug %}?path={{ row.location.path|urlencode }}&{{ filter.query }}"
        hx-trigger="toggle once"
        hx-target="find .tree"
        hx-swap="innerHTML"
      >
        <summary>{% include "schemas/_tree_label.html" %}</summary>
        <ul class="tree">
          <li class="tree__loading">Loading…</li>
        </ul>
      </details>
    {% else %}
      <div class="tree__leaf">{% include "schemas/_tree_label.html" %}</div>
    {% endif %}
  </li>
{% empty %}
  <li class="muted">Empty.</li>
{% endfor %}
