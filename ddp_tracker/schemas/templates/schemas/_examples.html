<div class="examples" id="examples">
  <h3>Example values</h3>
  {% if location.example_values %}
    <table class="table table-auto">
      <thead>
        <tr>
          <th scope="col">Value</th>
          <th scope="col">Origin</th>
        </tr>
      </thead>
      <tbody>
        {% for example in location.example_values %}
          <tr>
            <td><code>{{ example.value }}</code></td>
            <td><small class="muted">{% if example.source == "extracted" %}extracted{% else %}user input{% endif %}</small></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="muted">None yet</p>
  {% endif %}
  {% if user.is_authenticated %}
    <button type="button"
            class="btn btn--small"
            hx-get="{% url 'schemas:examples' location.pk %}"
            hx-target="closest .examples"
            hx-swap="outerHTML">Edit examples</button>
  {% endif %}
</div>
