volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  production_django_logs: {}
  production_ddp_incoming: {}


x-django: &django
  build:
    context: .
    dockerfile: ./compose/production/django/Dockerfile
  image: ddp_tracker_production_django
  volumes:
    - production_django_media:/app/ddp_tracker/media
    - production_django_logs:/app/logs
    # uploads wait here for the worker (DDP_INCOMING_DIR), so both containers need it
    - production_ddp_incoming:/app/var/incoming
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - ./.envs/.production/.django
    - ./.envs/.production/.postgres
  restart: unless-stopped


services:
  django:
    <<: *django
    command: /start

  # Parses uploaded DDPs (production TASKS backend is the database: django_tasks_db).
  worker:
    <<: *django
    command: python manage.py db_worker

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: ddp_tracker_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: ddp_tracker_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    restart: unless-stopped

  redis:
    image: docker.io/redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: ddp_tracker_production_nginx
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
    restart: unless-stopped
