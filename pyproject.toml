[project]
name = "ddp-tracker"
version = "0.1.0"
description = "Django + HTMX + Alpine application to track changes in platform DDPs"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "argon2-cffi==25.1",
  "crispy-bootstrap5==2026.9",
  "ddp-parser",
  "django>=5.2,<6",                      # https://github.com/django/django
  "django-allauth[mfa]==65.19.4",
  "django-anymail==15.2",
  "django-cors-headers==4.9",
  "django-crispy-forms==2.7",
  "django-csp>=4,<5",                    # https://github.com/mozilla/django-csp
  "django-environ>=0.11,<1",             # https://github.com/joke2k/django-environ
  "django-guid>=3.6.1,<4",               # https://github.com/snok/django-guid
  "django-model-utils==5",
  "django-ninja==1.7.1",
  "django-redis==7",
  "django-tasks>=0.12,<0.13",            # https://github.com/RealOrangeOne/django-tasks (backport of django.tasks)
  "django-tasks-db[compat]>=0.13,<0.14", # https://github.com/RealOrangeOne/django-tasks-db
  "gunicorn==26.2",
  "hiredis==3.4.1",
  "mkdocs-material>=9.7.7",
  "pillow==12.3",
  "psycopg[binary]==3.3.6",
  "pynacl>=1.6,<2",                      # https://github.com/pyca/pynacl (the uploader's values: ddps/values.py)
  "python-slugify==9.1",
  "redis==8.1",
  "whitenoise==6.12",
]

# --- Dev dependency group ---
[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "security" },
  { include-group = "debug" },
  "coverage==7.16.1",
  "django-coverage-plugin==3.2.2",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.1",
  "django-upgrade==1.32",
  "ipdb==0.13.13",
  "pre-commit>=4.6.2,<5",                 # https://github.com/pre-commit/pre-commit
  "psycopg[binary]==3.3.6",
  "werkzeug[watchdog]==3.1.8",
]
test = [
  "factory-boy>=3.3.3,<4",  # https://github.com/FactoryBoy/factory_boy
  "pytest>=9.1.1,<10",      # https://github.com/pytest-dev/pytest
  "pytest-cov>=7.1,<8",     # https://github.com/pytest-dev/pytest-cov
  "pytest-django>=4.14,<5", # https://github.com/pytest-dev/pytest-django
  "pytest-sugar==1.1.1",
]
debug = [
  "django-debug-toolbar>=6.3,<7", # https://github.com/jazzband/django-debug-toolbar
]
lint = [
  "django-stubs>=5.2.9", # https://github.com/typeddjango/django-stubs
  "djlint>=1.46.1,<2",   # https://github.com/Riverside-Healthcare/djlint
  "mypy>=2.3.1,<3",      # https://github.com/python/mypy
  "ruff>=0.16.7,<1",     # https://github.com/astral-sh/ruff
]
security = [
  "pip-audit>=2.10,<3", # https://github.com/pypa/pip-audit
]

[tool.uv]
sources.ddp-parser = { workspace = true }
package = false
workspace.members = [
  "packages/ddp-parser",
]

# ---------------------------------------------------------------------------
# djlint — Django template linting + formatting
# ---------------------------------------------------------------------------
[tool.djlint]
profile = "django"
extension = "html"
indent = 2
max_line_length = 100
ignore = "H006"  # img alt attribute — revisit once real templates exist

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8 + isort + black in one tool)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [ "ddp2json", "migrations" ]  # ddp2json: vendored prototype, reference only
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "A",     # flake8-builtins (shadowing builtins)
  "ANN",   # flake8-annotations
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except (bare `except Exception`)
  "C4",    # flake8-comprehensions
  "C90",   # mccabe complexity
  "COM",   # flake8-commas
  "DJ",    # flake8-django
  "DTZ",   # flake8-datetimez (naive datetimes)
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "ERA",   # eradicate (commented-out code)
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FA",    # flake8-future-annotations
  "FBT",   # flake8-boolean-trap
  "FLY",   # flynt (f-string conversion)
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INP",   # flake8-no-pep420 (implicit namespace packages)
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PD",    # pandas-vet (harmless if unused; catches misuse if you add pandas later)
  "PERF",  # perflint
  "PGH",   # pygrep-hooks (blanket noqa/type:ignore without a code, etc.)
  "PIE",   # flake8-pie (misc anti-patterns)
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi (stub files)
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff-specific rules
  "S",     # flake8-bandit (security)
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self (private member access)
  "SLOT",  # flake8-slots
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops (exception handling)
  "UP",    # pyupgrade — modernize syntax
  "W",     # pycodestyle warnings
  "YTT",   # flake8-2020 (sys.version misuse)
]
lint.ignore = [
  "ANN002",  # annotating *args
  "ANN003",  # annotating **kwargs
  "COM812",  # trailing-comma rule conflicts with the Ruff formatter itself
  "E501",    # line length handled by formatter; avoid double-reporting
  "FBT001",  # positional bool param — common in view/helper signatures
  "FBT002",  # positional bool default — same rationale
  "PLR0913", # too-many-arguments — Django views/forms legitimately take many
  "PLR0917", # too-many-positional-args — same rationale, paired with above
  "RUF012",  # mutable class attrs w/o ClassVar — noisy against Django's own conventions
  "S101",    # assert usage — fine in tests, and Django's own test tools use it
  "SIM102",  # nested if — sometimes more readable than a merged condition
]
lint.per-file-ignores."**/migrations/*.py" = [ "ANN", "E501", "N806", "PLR0915", "RUF012" ]
lint.per-file-ignores."**/settings/*.py" = [ "ANN", "F403", "F405" ]  # allow star imports in split settings if used
lint.per-file-ignores."**/tests.py" = [
  "ANN",
  "PLR2004",
  "PT009",
  "PT027",
  "S101",
  "SLF001"
]  # Django's TestCase (unittest-style) is the house testing convention
lint.per-file-ignores."**/tests/**/*.py" = [
  "ANN",
  "PLR2004",
  "PT009",
  "PT027",
  "S101",
  "SLF001"
]  # assert, loose typing, magic numbers, private access all fine in tests
lint.per-file-ignores."conftest.py" = [ "ANN", "S101" ]
lint.per-file-ignores."manage.py" = [ "ANN", "EM101", "PLC0415", "T20", "TRY003" ]  # Django's own manage.py boilerplate
lint.flake8-annotations.allow-star-arg-any = true
lint.flake8-annotations.suppress-none-returning = true  # don't force `-> None` on every view/handler
# msgspec resolves Struct annotations at runtime, so their imports can't move under TYPE_CHECKING
lint.flake8-type-checking.runtime-evaluated-base-classes = [ "msgspec.Struct" ]
lint.isort.known-first-party = [ "config", "ddp_tracker", "ddp_parser" ]
lint.isort.section-order = [ "future", "standard-library", "django", "third-party", "first-party", "local-folder" ]
lint.isort.sections.django = [ "django" ]
lint.mccabe.max-complexity = 12  # default is 10; Django view branching pushes past that quickly
lint.pylint.max-args = 8  # default 5 — too tight for Django view/service functions
lint.pylint.max-branches = 15  # default 12
lint.pylint.max-statements = 60  # default 50 — generous for views doing form handling + HTMX branching

# ---------------------------------------------------------------------------
# Mypy — static typing (django-stubs plugin understands Django's dynamic bits)
# ---------------------------------------------------------------------------
[tool.mypy]
exclude = [ "^ddp2json/", "migrations/" ]  # ddp2json: vendored prototype, reference only
ignore_missing_imports = true
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [ "mypy_django_plugin.main" ]

# Start lenient on a clean repo; tighten (disallow_untyped_defs = true, etc.)
# once the codebase has enough type coverage to make it useful rather than noisy.
[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest]
ini_options.norecursedirs = [ ".*", "ddp2json", "node_modules" ]  # ddp2json: vendored prototype, reference only
ini_options.python_files = [ "*_test.py", "test_*.py", "tests.py" ]
ini_options.addopts = "--reuse-db --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
ini_options.filterwarnings = [
  "error",
  "ignore::DeprecationWarning:django.*",
]
# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
ini_options.DJANGO_SETTINGS_MODULE = "config.settings.local"

[tool.coverage]
# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
run.source = [ "." ]
run.omit = [
  "*/asgi.py",
  "*/migrations/*",
  "*/settings/*",
  "*/test_*.py",
  "*/tests/*",
  "*/wsgi.py",
  ".venv/*",
  "ddp2json/*",
  "manage.py",
  "venv/*",
]
run.branch = true
report.exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.skip_covered = false
report.show_missing = true
