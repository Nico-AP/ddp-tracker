[project]
name = "ddp-tracker"
version = "0.1.0"
description = "Django + HTMX + Alpine application to track changes in platform DDPs"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",  # https://github.com/django/django
    "django-csp>=4.0,<5",  # https://github.com/mozilla/django-csp
    "django-environ>=0.11,<1",  # https://github.com/joke2k/django-environ
    "django-guid>=3.6.1,<4",  # https://github.com/snok/django-guid
]

[tool.uv]
package = false

# --- Dev dependency group ---
[dependency-groups]
lint = [
    "ruff>=0.16.7,<1",  # https://github.com/astral-sh/ruff
    "djlint>=1.46.1,<2",  # https://github.com/Riverside-Healthcare/djlint
    "mypy>=2.3.1,<3",  # https://github.com/python/mypy
    "django-stubs>=5.2.9",  # https://github.com/typeddjango/django-stubs
]
test = [
    "pytest>=9.1.1,<10",  # https://github.com/pytest-dev/pytest
    "pytest-django>=4.14,<5",  # https://github.com/pytest-dev/pytest-django
    "pytest-cov>=7.1,<8",  # https://github.com/pytest-dev/pytest-cov
    "factory-boy>=3.3.3,<4",  # https://github.com/FactoryBoy/factory_boy
]
security = [
    "pip-audit>=2.10,<3",  # https://github.com/pypa/pip-audit
]
debug = [
    "django-debug-toolbar>=6.3,<7",  # https://github.com/jazzband/django-debug-toolbar
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "security"},
    {include-group = "debug"},
    "pre-commit>=4.6.2,<5",  # https://github.com/pre-commit/pre-commit
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8 + isort + black in one tool)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "C90",   # mccabe complexity
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade — modernize syntax
    "YTT",   # flake8-2020 (sys.version misuse)
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "BLE",   # flake8-blind-except (bare `except Exception`)
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins (shadowing builtins)
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez (naive datetimes)
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420 (implicit namespace packages)
    "PIE",   # flake8-pie (misc anti-patterns)
    "T20",   # flake8-print
    "PYI",   # flake8-pyi (stub files)
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self (private member access)
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "INT",   # flake8-gettext
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "PD",    # pandas-vet (harmless if unused; catches misuse if you add pandas later)
    "PGH",   # pygrep-hooks (blanket noqa/type:ignore without a code, etc.)
    "PL",    # pylint
    "TRY",   # tryceratops (exception handling)
    "FLY",   # flynt (f-string conversion)
    "PERF",  # perflint
    "LOG",   # flake8-logging
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",     # line length handled by formatter; avoid double-reporting
    "S101",     # assert usage — fine in tests, and Django's own test tools use it
    "RUF012",   # mutable class attrs w/o ClassVar — noisy against Django's own conventions
    "SIM102",   # nested if — sometimes more readable than a merged condition
    "FBT001",   # positional bool param — common in view/helper signatures
    "FBT002",   # positional bool default — same rationale
    "COM812",   # trailing-comma rule conflicts with the Ruff formatter itself
    "ANN002",   # annotating *args
    "ANN003",   # annotating **kwargs
    "PLR0913",  # too-many-arguments — Django views/forms legitimately take many
    "PLR0917",  # too-many-positional-args — same rationale, paired with above
]

[tool.ruff.lint.mccabe]
max-complexity = 12   # default is 10; Django view branching pushes past that quickly

[tool.ruff.lint.pylint]
max-args = 8          # default 5 — too tight for Django view/service functions
max-branches = 15      # default 12
max-statements = 60    # default 50 — generous for views doing form handling + HTMX branching

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true   # don't force `-> None` on every view/handler

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012", "ANN", "N806", "PLR0915"]
"**/tests/**/*.py" = ["S101", "ANN", "PLR2004", "SLF001", "PT009", "PT027"]  # assert, loose typing, magic numbers, private access all fine in tests
"**/tests.py" = ["S101", "ANN", "PLR2004", "SLF001", "PT009", "PT027"]  # Django's TestCase (unittest-style) is the house testing convention
"**/settings/*.py" = ["F403", "F405", "ANN"]  # allow star imports in split settings if used
"manage.py" = ["T20", "ANN", "PLC0415", "TRY003", "EM101"]  # Django's own manage.py boilerplate
"conftest.py" = ["ANN", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# djlint — Django template linting + formatting
# ---------------------------------------------------------------------------
[tool.djlint]
profile = "django"
extension = "html"
indent = 2
max_line_length = 100
ignore = "H006"  # img alt attribute — revisit once real templates exist

# ---------------------------------------------------------------------------
# Mypy — static typing (django-stubs plugin understands Django's dynamic bits)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Start lenient on a clean repo; tighten (disallow_untyped_defs = true, etc.)
# once the codebase has enough type coverage to make it useful rather than noisy.

[tool.django-stubs]
django_settings_module = "config.settings.local"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--reuse-db --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:django.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    ".venv/*",
    "venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
skip_covered = false
show_missing = true
