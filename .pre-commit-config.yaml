repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: debug-statements

  # Run tools through `uv run` so hook versions always match the versions
  # pinned in pyproject.toml / uv.lock — no separate version to keep in sync.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: djlint
        name: djlint (Django templates)
        entry: uv run djlint --lint
        language: system
        types: [html]
        require_serial: true

      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: uv run pip-audit
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
