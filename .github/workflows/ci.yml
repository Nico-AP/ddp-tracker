name: CI

on:
  push:
    branches: [main, dev, stage]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail instead of silently updating uv.lock

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: djlint
        run: uv run djlint . --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run test suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.cicd
        run: uv run pytest

  test-postgres:
    # Same suite on PostgreSQL, the production database: catches what SQLite hides (e.g. jsonb
    # sorting JSON object keys)
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ddp_tracker
          POSTGRES_PASSWORD: ddp_tracker
          POSTGRES_DB: ddp_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddp_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run test suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.cicd
          DATABASE_URL: postgres://ddp_tracker:ddp_tracker@localhost:5432/ddp_tracker
        run: uv run pytest

  security:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: pip-audit
        run: uv run pip-audit

  assets:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Sass
        run: npm run build
